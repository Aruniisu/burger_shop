name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install   # changed from npm ci to npm install
      - name: Build
        run: npm run build
      # other steps (e.g., lint, test) remain unchanged

  # deploy job is untouched and will continue to run as before