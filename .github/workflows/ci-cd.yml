name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node }}-${{ hashFiles('root/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node }}-

      - name: Install dependencies
        run: npm ci
        working-directory: root

      - name: Lint
        run: npm run lint
        working-directory: root

      - name: Test
        run: echo "No tests defined"
        working-directory: root

      - name: Build
        run: npm run build
        working-directory: root

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.node }}
          path: root/.next
          retention-days: 7

      - name: Security Scan - npm audit
        run: npm audit --audit-level=high
        working-directory: root
        continue-on-error: true

      - name: Security Scan - CodeQL Init
        uses: github/codeql-action/init@v2
        with:
          languages: javascript

      - name: Security Scan - CodeQL Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Security Scan - CodeQL Analyze
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:javascript"

      - name: Deploy to Production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "Deploying build-${{ matrix.node }} to production..."
          # Insert deployment commands here, e.g., vercel --prod or similar
        working-directory: root

      - name: Failure Notification
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const { context, github } = require('@actions/github');
            const message = `❌ CI job failed for ${context.workflow} on ${context.ref} (Node ${{ matrix.node }})`;
            if (context.payload.pull_request) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: message
              });
            } else {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: 'failure',
                description: message,
                context: 'CI Failure Notification'
              });
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}